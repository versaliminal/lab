---
private_data_url: 
networks:
  lab:
    cidr_block: 192.168.5.0/24
    default_gateway: 192.168.5.1
    dhcp_pool:
      start: 192.168.5.10
      end: 192.168.5.140
    wan:
      ip: 192.168.1.38
  home:
    cidr_block: 192.168.1.0/24
    default_gateway: 192.168.1.1
    dhcp_pool:
      start: 192.168.1.20
      end: 192.168.1.254
tailscale:
  endpoints:
    druid:
      host: druid
      routes:
        - 192.168.5.0/24
    exit-node:
      host: exit-node
      routes:
        - 0.0.0.0/0
    fedora:
      host: fedora
network_devices:
  druid:
    name: druid
    type: gateway-router
    network: lab
    os: pfsense+
    model: netgate-2100
    vip: 100.67.48.65
    primary_ip: 192.168.5.1
    interfaces:
      - network: lab
        ip: 192.168.5.1
        type: lan
      - network: home
        ip: 192.168.1.38
        type: wan
    ports:
      lan: 4xGbE
      wan: 1xGbE
  switch1:
    name: switch1
    type: switch
    network: lab
    os: unmanaged
    model: dlink-DGS-108
    ports:
      total: 8xGbE
hosts:
  wizard: &wizard
    name: wizard
    os: proxmox
    primary_ip: 192.168.5.158
    ui_port: 8006
    forward: 192.168.1.38:8001
    resources:
      cores: 22
      mem: 64GB
      local_disk: 4TB
    deployment:
      image: proxmox
    interfaces:
      - network: lab
        ip: 192.168.5.158
        type: bridge
        bridge: vmbr0
      - network: home
        ip: 192.168.1.18
        type: bridge
        bridge: vmbr1
  warlock: &warlock
    name: warlock
    os: proxmox
    primary_ip: 192.168.5.153
    ui_port: 8006
    forward: 192.168.1.38:8002
    resources:
      cores: 16
      mem: 64GB
      local_disk: 4TB
      disk_array:
        - &warlock_array1
          name: warlock_array1
          passthrough: true
          disks:
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
    deployment:
      image: proxmox
    interfaces:
      - network: lab
        ip: 192.168.5.153
        type: bridge
        bridge: vmbr0
      - network: home
        ip: 192.168.1.19
        type: bridge
        bridge: vmbr1
  sorcerer: &sorcerer
    name: sorcerer
    os: proxmox
    primary_ip: 192.168.5.159
    ui_port: 8006
    forward: 192.168.1.38:8003
    resources:
      cores: 20
      mem: 48GB
      local_disk: 4TB
    deployment:
      image: proxmox
    interfaces:
      - network: lab
        ip: 192.168.5.159
        type: bridge
        bridge: vmbr0
      - netowrk: home
        ip: 192.168.1.17
        type: bridge
        bridge: vmbr1
vms:
  truenas: &truenas
    name: truenas
    primary_ip: 192.168.5.211
    forward: 192.168.1.38:8004
    deployment:
      image: truenas
    bridges:
      - vmbr0
  fedora:
    name: fedora
    primary_ip: 192.168.5.223
    vip: 100.124.29.45
    deployment:
      image: fedora
    bridges:
      - vmbr0
  haos:
    name: haos
    primary_ip: 192.168.1.52
    port: 8123
    deployment:
      image: haos
    bridges:
      - vmbr1
  exit_node:
    name: exit-node
    primary_ip: 192.168.1.57
    deployment:
      image: fedora
    bridges:
      - vmbr1
  talos_sorcerer: &talos_sorcerer
    name: talos_sorcerer
    os: talos
    role: control-plane
    primary_ip: 192.168.5.221
    deployment:
      image: talos-tailscale
    bridges:
      - vmbr0
  talos_warlock: &talos_warlock
    name: talos_warlock
    os: talos
    role: worker
    primary_ip: 192.168.5.222
    deployment:
      image: talos-tailscale
    bridges:
      - vmbr0
  talos_wizard: &talos_wizard
    name: talos_wizard
    os: talos
    role: worker
    primary_ip: 192.168.5.220
    deployment:
      image: talos-tailscale
    bridges:
      - vmbr0
kubernetes:
  primary:
    name: talos-primary
    type: talos
    control_plane: *talos_sorcerer
    workers:
      - *talos_warlock
      - *talos_wizard
    kubeconfig: config/talos/kubeconfig
    config_dir: config/talos
    talos_config: config/talos/talosconfig
    patches:
      - config/talos/tailscale.patch.yaml
    ingress:
      type: traefik-gateway
      external_ip: 192.168.5.220
      service_hosts:
        - pb.verssaliminal.org
storage_groups:
  sg1:
    name: SG1
    type: raidz
    storage: 10TB,
    host: *warlock
    disk_array: *warlock_array1
    owner: *truenas
    shares:
      nfs:
        - name: shared
          path: /mnt/SG1/shared
      smb:
        - name: shared
        - name: backups
        - name: timemachine
images:
  talos-tailscale:
    id: 4a0d65c669d46663f377e7161e50cfd570c401f26fd9e7bda34a0216b6f1922b
    build: factory.talos.dev/metal-installer/4a0d65c669d46663f377e7161e50cfd570c401f26fd9e7bda34a0216b6f1922b:v1.12.1
    file: images/talos-1-12-1-metal-amd64.iso
    image: https://factory.talos.dev/image/4a0d65c669d46663f377e7161e50cfd570c401f26fd9e7bda34a0216b6f1922b/v1.12.1/metal-amd64.iso
  fedora:
    id: server-x86_64-43-1.6
    file: images/Fedora-Server-dvd-x86_64-43-1.6.iso
    image: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Server/x86_64/iso/Fedora-Server-dvd-x86_64-43-1.6.iso
  proxmox:
    id: proxmox-ve_8.3-1
    image: ""
    comment: No longer available from proxmox.com
  haos:
    id: x86-64-14.2
    file: images/haos_generic-x86-64-14.2.img.xz
    image: https://github.com/home-assistant/operating-system/releases/download/14.2/haos_generic-x86-64-14.2.img.xz
  truenas:
    id: TrueNAS-13.0-U6.7
    image: ""
    comment: No direct download link available