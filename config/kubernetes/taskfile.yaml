---
version: 3

vars:
  INFRA_NAMESPACE: infra

tasks:
  traefik:install:
    vars:
      url: https://traefik.github.io/charts
      name: traefik
      vars_file: traefik/vars.yaml
      version: v35.0.1
    cmds:
      - kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml
      - kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/v3.5/docs/content/reference/dynamic-configuration/kubernetes-gateway-rbac.yml
      - helm repo add {{.name}} {{.url}}
      - helm repo update
      - | 
        helm upgrade --install "{{.name}}" "{{.name}}/{{.name}}" \
        --version "{{.version}}" \
        -n "{{.INFRA_NAMESPACE}}" \
        --create-namespace \
        -f {{.vars_file}}" \
      - kubectl apply -f traefik/gateway.yaml
    desc: Install upstream Helm chart for Traefik with Gateway API
  traefik:uninstall:
    vars:
      name: traefik
    cmds:
      - helm uninstall {{.name}} -n {{.INFRA_NAMESPACE}}
      - kubectl delete -f traefik/gateway.yaml
    desc: Uninstall upstream Helm chart for Traefik with Gateway API

  privatebin:install:
    vars:
      url: https://privatebin.github.io/helm-chart
      name: privatebin
    cmds:
      - helm repo add {{.name}} {{.url}}
      - helm repo update
      - helm upgrade --install {{.name}} {{.name}}/privatebin -n {{.INFRA_NAMESPACE}} --create-namespace
      - kubectl -n {{.INFRA_NAMESPACE}} apply -f privatebin/ingressroute.yaml
    desc: Install upstream Helm chart for PrivateBin
  privatebin:uninstall:
    vars:
      url: https://privatebin.github.io/helm-chart
      name: privatebin
    cmds:
      - helm uninstall {{.name}} -n {{.INFRA_NAMESPACE}}
      - kubectl -n {{.INFRA_NAMESPACE}} delete -f privatebin/ingressroute.yaml
    desc: Uninstall upstream Helm chart for PrivateBin
  
  tls:install:
      desc: Install Kubernetes TLS secrets
      cmds:
        - kubectl create secret tls versaliminal-tls --cert=config/tls/versaliminal-entity.crt --key=config/tls/versaliminal-entity.key --namespace=infra
  tls:uninstall:
    desc: Uninstall Kubernetes TLS secrets
    cmds:
      - kubectl delete secret versaliminal-tls --namespace=infra