---
network:
  lab:
    cidr_block: 192.168.5.0/24
    default_gateway: 192.168.5.1
    dhcp_pool:
      start: 192.168.5.10
      end: 192.168.5.140
    wan:
      ip: 192.168.1.38
  home:
    cidr_block: 192.168.1.0/24
    default_gateway: 192.168.1.1
    dhcp_pool:
      start: 192.168.1.20
      end: 192.168.1.254
network_devices:
  - name: druid
    network: lab
    os: pfsense+
    model: netgate-2100
    vip: 100.67.48.65
    ip: 192.168.5.1
    ports:
      lan: 4xGbE
      wan: 1xGbE
hosts:
  - &wizard
    name: wizard
    os: proxmox
    ip: 192.168.5.158
    key: keys/wizard
    ui_port: 8006
    forward: 192.168.1.38:8001
    resources:
      cores: 22
      mem: 64GB
      local_disk: 4TB
    deployment:
      image: proxmox
    interfaces:
      - network: lab
        type: bridge
        bridge: vmbr0
      - network: home
        type: bridge
        bridge: vmbr1
  - &warlock
    name: warlock
    os: proxmox
    ip: 192.168.5.153
    key: keys/warlock
    ui_port: 8006
    forward: 192.168.1.38:8002
    resources:
      cores: 16
      mem: 64GB
      local_disk: 4TB
      disk_array:
        - &warlock_array1
          name: warlock_array1
          passthrough: true
          disks:
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
    deployment:
      image: proxmox
    interfaces:
      - network: lab
        type: bridge
        bridge: vmbr0
      - network: home
        type: bridge
        bridge: vmbr1
  - &sorcerer
    name: sorcerer
    os: proxmox
    ip: 192.168.5.159
    key: keys/sorcerer
    ui_port: 8006
    forward: 192.168.1.38:8003
    resources:
      cores: 20
      mem: 48GB
      local_disk: 4TB
    deployment:
      image: proxmox
    interfaces:
      - network: lab
        type: bridge
        bridge: vmbr0
vms:
  - &truenas
    name: truenas
    ip: 192.168.5.211
    forward: 192.168.1.38:8004
    deployment:
      image: truenas
    bridge: vmbr0
  - name: fedora
    ip: 192.168.5.223
    vip: 100.124.29.45
    key: keys/fedora
    deployment:
      image: fedora
    bridge: vmbr0
  - name: haos
    ip: 192.168.1.52
    port: 8123
    deployment:
      image: haos
    bridge: vmbr1
  - name: exit-node
    ip: dhcp
    key: keys/exit-node
    deployment:
      image: fedora
    bridge: vmbr1
  - &talos_sorcerer
    name: talos_sorcerer
    os: talos
    role: control-plane
    ip: 192.168.5.221
    deployment:
      image: talos-tailscale
    bridge: vmbr0
  - &talos_warlock
    name: talos_warlock
    os: talos
    role: worker
    ip: 192.168.5.222
    deployment:
      image: talos-tailscale
    bridge: vmbr0
  - &talos_wizard
    name: talos_wizard
    os: talos
    role: worker
    ip: 192.168.5.220
    deployment:
      image: talos-tailscale
    bridge: vmbr0
kubernetes:
  primary:
    name: talos-primary
    type: talos
    control_plane: *talos_sorcerer
    workers:
      - *talos_warlock
      - *talos_wizard
    kubeconfig: config/talos/kubeconfig
    config_dir: config/talos
    talos_config: config/talos/talosconfig
    patches:
      - config/talos/tailscale.patch.yaml
storage_groups:
  - name: "SG1"
    type: raidz
    storage: 10TB,
    host: *warlock
    disk_array: *warlock_array1
    owner: *truenas
    shares:
      nfs:
        - name: shared
          path: /mnt/SG1/shared
      smb:
        - name: shared
        - name: backups
        - name: timemachine
images:
  talos-tailscale:
    id: 4a0d65c669d46663f377e7161e50cfd570c401f26fd9e7bda34a0216b6f1922b
    build: factory.talos.dev/metal-installer/4a0d65c669d46663f377e7161e50cfd570c401f26fd9e7bda34a0216b6f1922b:v1.12.1
    file: images/talos-1-12-1-metal-amd64.iso
    image: https://factory.talos.dev/image/4a0d65c669d46663f377e7161e50cfd570c401f26fd9e7bda34a0216b6f1922b/v1.12.1/metal-amd64.iso
  fedora:
    id: server-x86_64-43-1.6
    file: images/Fedora-Server-dvd-x86_64-43-1.6.iso
    image: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Server/x86_64/iso/Fedora-Server-dvd-x86_64-43-1.6.iso
  proxmox:
    id: proxmox-ve_8.3-1
    image: ""
    comment: No longer available from proxmox.com
  haos:
    id: x86-64-14.2
    file: images/haos_generic-x86-64-14.2.img.xz
    image: https://github.com/home-assistant/operating-system/releases/download/14.2/haos_generic-x86-64-14.2.img.xz
  truenas:
    id: TrueNAS-13.0-U6.7
    image: ""
    comment: No direct download link available