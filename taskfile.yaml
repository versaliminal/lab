---
version: 3

includes:
  upstream: config/kubernetes/upstream-helm/taskfile.yaml
  talos: config/talos/taskfile.yaml

tasks:
  init:
    desc: Initialize repository state
    cmds:
      - task private-files:unarchive
      - python3 -m venv .venv
      - .venv/bin/python3 -m pip install -r scripts/requirements.txt
      - .venv/bin/python3 scripts/invutil.py --env

  tls:generate:
    vars:
      base_dir: config/tls
      days_valid: 999
      subject: "/C=US/ST=TX/L=Austin/O=VERSALIMINAL/CN=*.versaliminal.org"
      san: "subjectAltName=DNS:*.versaliminal.org,IP:192.168.5.220"
    desc: Generate TLS certificates
    cmds:
      - | # Create CA cert
        openssl req -nodes -x509 -sha256 -newkey rsa:4096 \
        -keyout {{.base_dir}}/versaliminal-ca.key \
        -out {{.base_dir}}/versaliminal-ca.csr \
        -days {{.days_valid}} \
        -subj "{{.subject}}" \
        -addext "{{.san}}" \
        -addext "basicConstraints=critical,CA:true"
      - | # Create entity cert
        openssl req -nodes -x509 -sha256 -newkey rsa:4096 \
        -keyout {{.base_dir}}/versaliminal-entity.key \
        -out {{.base_dir}}/versaliminal-entity.crt \
        -days {{.days_valid}} \
        -subj "{{.subject}}" \
        -addext "{{.san}}" \
        -addext "basicConstraints=CA:false"
  tls:k8s:install:
    desc: Install Kubernetes TLS secrets
    cmds:
      - kubectl create secret tls versaliminal-tls --cert=config/tls/versaliminal-entity.crt --key=config/tls/versaliminal-entity.key --namespace=infra
  tls:k8s:uninstall:
    desc: Uninstall Kubernetes TLS secrets
    cmds:
      - kubectl delete secret versaliminal-tls --namespace=infra

  archive:
    desc: Archive lab files
    vars:
      tar_file: lab.tar.zst
    cmds:
      - tar --zstd -vf {{.tar_file}} --exclude .venv -c .
      
  private-files:archive:
    desc: Archive private lab files
    vars:
      tar_file: lab-private.tar.zst
    cmds:
      - tar --zstd -vf {{.tar_file}} -c config/ssh config/talos/ config/tls inventory.private.yaml
      - gpg --symmetric --cipher-algo AES256 {{.tar_file}}
      - rm {{.tar_file}}
  private-files:unarchive:
    desc: Unarchive private lab files
    vars:
      tar_file: lab-private.tar.zst
    cmds:
      - gpg --decrypt -o {{.tar_file}} {{.tar_file}}.gpg
      - tar --zstd -xvf {{.tar_file}}
      - rm {{.tar_file}}