---
network_devices:
  - name: druid
    os: pfsense+
    model: netgate-2100
    vip: 100.67.48.65
    ip: 192.168.5.1
    ports:
      lan: 4xGbE
      wan: 1xGbE
hosts:
  - &wizard
    name: wizard
    os: proxmox
    ip: 192.168.5.158
    key: keys/wizard
    ui_port: 8006
    forward: 192.168.1.38:8001
    resources:
      cores: 22
      mem: 64GB
      local_disk: 4TB
  - &warlock
    name: warlock
    os: proxmox
    ip: 192.168.5.153
    key: keys/warlock
    ui_port: 8006
    forward: 192.168.1.38:8002
    resources:
      cores: 16
      mem: 64GB
      local_disk: 4TB
      disk_array:
        - &warlock_array1
          name: warlock_array1
          passthrough: true
          disks:
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
            - type: WD Red Plus NAS HDD
              size: 4TiB
              speed: 5400rpm
  - &sorcerer
    name: sorcerer
    os: proxmox
    ip: 192.168.5.159
    key: keys/sorcerer
    ui_port: 8006
    forward: 192.168.1.38:8003
    resources:
      cores: 20
      mem: 48GB
      local_disk: 4TB
vms:
  - &truenas
    name: truenas
    ip: 192.168.5.211
    forward: 192.168.1.38:8004
  - name: fedora
    ip: 192.168.5.223
    vip: 100.124.29.45
    key: keys/fedora
  - name: haos
    ip: 192.168.5.212
    port: 8123
    forward: 192.168.1.38:8123
  - &talos_sorcerer
    name: talos_sorcerer
    os: talos
    role: control-plane
    ip: 192.168.5.221
  - &talos_warlock
    name: talos_warlock
    os: talos
    role: worker
    ip: 192.168.5.222
  - &talos_wizard
    name: talos_wizard
    os: talos
    role: worker
    ip: 192.168.5.220
kubernetes:
  - name: talos-primary
    type: talos
    control_plane: *talos_sorcerer
    workers:
      - *talos_warlock
      - *talos_wizard
    kubeconfig: config/talos/kubeconfig
    config_dir: config/talos
    talos_config: config/talos/talosconfig
    patches:
      - config/talos/tailscale.patch.yaml
storage_groups:
  - name: "SG1"
    type: raidz
    storage: 10TB,
    host: *warlock
    disk_array: *warlock_array1
    owner: *truenas
    shares:
      nfs:
        - name: shared
          path: /mnt/SG1/shared
      smb:
        - name: shared
        - name: backups
        - name: timemachine